name: Build Debian Kernel Package (Mi Pad 2 / latte)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc clang lld llvm \
            dpkg-dev debhelper fakeroot \
            libdw-dev

      - name: Configure Kernel
        run: |
          chmod +x build.sh
          ./build.sh xiaomipad2_defconfig

      - name: Build Debian Package
        run: |
          ./build.sh deb-pkg -j$(nproc)

      - name: Locate and Upload DEB Packages
        run: |
          echo "=== Searching for .deb files ==="
          find . .. -maxdepth 3 -name "*.deb" -type f 2>/dev/null || true
          mkdir -p deb-output
          # deb-pkg 通常把包放在源码根目录的上一级，这里兜底搜索
          find . .. -maxdepth 3 -name "*.deb" -type f -exec cp {} deb-output/ \; 2>/dev/null || true
          ls -lh deb-output/

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-latte-deb-packages
          path: deb-output/*.deb
          if-no-files-found: warn
